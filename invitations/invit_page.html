<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/invit_style.css">
</head>

<body>

    <!-- COVER SCREEN -->
<div id="coverScreen" class="cover-screen">
    <div class="cover-content text-center">
        <p>Undangan Pernikahan</p>
        <h1 id="invitation_title" class="title-script"></h1>
        <br>
        <p>Kepada Yth.</p>
        <h3 id="guestName"></h3>

        <button id="openInvitation" class="btn btn-romantic mt-4">
            Buka Undangan
        </button>
    </div>
</div>

<div id="mainContent" style="display:none;">
    <!-- HERO + semua section -->
     
    <!-- HERO -->
    <section class="hero">
        <div>
            <p>Kepada Yth.</p>
            <h2 id="guestNameInvitation"></h2>
            <h5>di tempat <i id="guestAddress"></i></h5>
            <div class="divider"></div>
            <p>Dengan penuh rasa hormat, anda diundang dalam sebuah acara:</p>
            <h1 class="title-script" id="invitation_title_guest"></h1>
        </div>
    </section>
        
    <div class="container">

        <!-- EVENT INFO -->
        <div class="section-card text-center">
            <h3>Detail Acara</h3>
            <div class="divider"></div>

            <p><strong>Akad</strong></p>
            <p id="akad_time"></p>

            <p class="mt-3"><strong>Resepsi</strong></p>
            <p id="resepsi_time"></p>

            <p class="mt-3"><strong>Lokasi</strong></p>
            <p id="location"></p>

            <a id="mapsLink" target="_blank" class="btn btn-romantic mt-3">
                Lihat Lokasi
            </a>
        </div>

        <!-- COUNTDOWN -->
        <div class="section-card text-center">
            <h3>Menuju Hari Bahagia</h3>
            <div class="divider"></div>
            <div class="countdown-box" id="countdown"></div>
        </div>

        <!-- RSVP -->
        <div class="section-card">
            <h3 class="text-center">Konfirmasi Kehadiran</h3>
            <div class="divider"></div>

            <form id="rsvpForm">
                <div class="mb-3">
                    <label>Jumlah Tamu</label>
                    <input type="number" id="guestCount" class="form-control" value="1">
                </div>

                <div class="mb-3">
                    <label>Status Kehadiran</label>
                    <select id="attendanceStatus" class="form-control">
                        <option value="attending">Hadir</option>
                        <option value="not_attending">Tidak Hadir</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Pesan & Doa</label>
                    <textarea id="message" class="form-control"></textarea>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-romantic">
                        Kirim Konfirmasi
                    </button>
                </div>
            </form>
        </div>

    </div>
    <footer>
        Made with ❤️ for our special day 
        <br>
        Dani & Diana
    </footer>
</div>




<!-- Background Music -->
<audio id="bgMusic" loop>
    <source src="../assets/music/gending.mp3" type="audio/mpeg">
</audio>

<button class="music-control" id="musicBtn">
    🔊
</button>
<script src="../js/invit_script.js"></script>
</body>
</html>
